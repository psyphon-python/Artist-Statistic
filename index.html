<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artist Statistic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Artist Statistic</h1>
    <p>Welcome to the digital grid. Welcome to the world.</p>

    <div class="gallery">
      <h2>Manga Gallery</h2>
      <div class="grid">
        <img src="assets/manga1.jpg" alt="Manga Art 1" />
        <img src="assets/manga2.jpg" alt="Manga Art 2" />
        <img src="assets/manga3.jpg" alt="Manga Art 3" />
        <img src="assets/manga4.jpg" alt="Manga Art 4" />
        <img src="assets/manga5.jpg" alt="Manga Art 5" />
      </div>
    </div>

    <footer class="artist-stat">
      <div class="artist-name">ARTIST: BEN@ARTIST STATISTIC</div>
      <div class="artist-stat">
        <h3>Artist statistic</h3>
        <p>This is your digital signature. 100% energy. 0% battery.</p>
      </div>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
