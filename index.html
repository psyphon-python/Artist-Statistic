<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JoyStar Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="site-wrapper">
    <header class="container window-card">
      <h1>JoyStar Gallery</h1>
      <p>Welcome to the digital grid. Welcome to the world.</p>
    </header>

    <main class="gallery window-card">
      <h2>Manga Gallery</h2>
      <div class="grid">
        <img src="assets/manga1.jpg" alt="Manga Art 1" loading="lazy" />
        <img src="assets/manga2.jpg" alt="Manga Art 2" loading="lazy" />
        <img src="assets/manga3.jpg" alt="Manga Art 3" loading="lazy" />
        <img src="assets/manga4.jpg" alt="Manga Art 4" loading="lazy" />
        <img src="assets/manga5.jpg" alt="Manga Art 5" loading="lazy" />
      </div>
    </main>

    <footer class="artist-stat window-card">
      <div class="artist-name">ARTIST: JoyStar</div>
      <div class="artist-info">
        <h3>Artist Statistic</h3>
        <p>This is your digital signature. 100% energy. 0% battery.</p>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
